<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mis Tickets · PLAi</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #050810; --surface: #0c1020; --border: rgba(255,255,255,0.07);
      --accent: #00d4ff; --accent2: #7b2ff7; --text: #e8eaf0; --muted: #5a6080;
      --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background: radial-gradient(ellipse 60% 50% at 10% 20%,rgba(0,212,255,0.07),transparent), radial-gradient(ellipse 50% 60% at 90% 80%,rgba(123,47,247,0.08),transparent); }

    header { position:sticky;top:0;z-index:50; background:rgba(5,8,16,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 24px; }
    .header-inner { max-width:1100px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px; }
    .logo { display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:1.2em; background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
    .user-chip { display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,0.03);font-size:.85em; }
    .avatar { width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:800;font-family:var(--font-head);color:#fff;flex-shrink:0; }
    .user-name { color:var(--text);font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .badge-role { padding:2px 8px;border-radius:999px;background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.25);color:var(--accent);font-size:.75em;font-weight:700;white-space:nowrap; }
    .btn-logout { padding:7px 14px;border-radius:8px;border:1px solid rgba(255,71,87,0.3);background:rgba(255,71,87,0.08);color:#ff6b7a;font-size:.82em;font-weight:600;cursor:pointer;transition:all .2s; }
    .btn-logout:hover { background:rgba(255,71,87,0.15);border-color:rgba(255,71,87,0.5); }

    main { max-width:1100px;margin:0 auto;padding:32px 24px;position:relative;z-index:1; }
    .page-title { font-family:var(--font-head);font-size:1.8em;font-weight:800;margin-bottom:4px;letter-spacing:-0.5px; }
    .page-sub { color:var(--muted);font-size:.9em;margin-bottom:28px; }

    .kpis { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px; }
    .kpi { background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:12px;padding:18px 20px;transition:transform .2s,border-color .2s; }
    .kpi:hover { transform:translateY(-2px);border-color:rgba(0,212,255,0.2); }
    .kpi .k { font-size:.75em;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:8px; }
    .kpi .v { font-family:var(--font-head);font-size:2em;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }

    .table-wrap { background:rgba(12,16,32,0.6);border:1px solid var(--border);border-radius:14px;overflow:hidden;backdrop-filter:blur(10px); }
    table { width:100%;border-collapse:collapse;min-width:700px; }
    thead th { padding:14px 16px;font-size:.75em;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:700;background:rgba(0,0,0,0.2);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap; }
    tbody td { padding:16px;font-size:.88em;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle;line-height:1.5; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:rgba(0,212,255,0.03); }

    .ticket-id { color:var(--accent);font-family:var(--font-head);font-weight:700;font-size:.9em; }
    .muted { color:var(--muted);font-size:.85em; }

    .pill { display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:.78em;border:1px solid; }
    .dot { width:6px;height:6px;border-radius:50%;display:inline-block; }
    .p-alta { background:rgba(255,71,87,0.12);border-color:rgba(255,71,87,0.35);color:#ff4757; }
    .p-alta .dot { background:#ff4757; }
    .p-media { background:rgba(255,165,2,0.12);border-color:rgba(255,165,2,0.35);color:#ffa502; }
    .p-media .dot { background:#ffa502; }
    .p-baja { background:rgba(46,213,115,0.12);border-color:rgba(46,213,115,0.35);color:#2ed573; }
    .p-baja .dot { background:#2ed573; }

    .status { color:#64ffda;font-weight:700;font-size:.85em; }
    .thumb { width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--border);background:rgba(0,0,0,0.3); }
    .thumb-btn { display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid rgba(0,212,255,0.2);background:rgba(255,255,255,0.03);color:var(--text);cursor:pointer;font-size:.82em;font-weight:600;transition:all .2s; }
    .thumb-btn:hover { border-color:rgba(0,212,255,0.5);background:rgba(0,212,255,0.06); }

    .table-footer { display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 16px;background:rgba(0,0,0,0.15);border-top:1px solid var(--border); }
    .pager { display:flex;gap:8px;align-items:center; }
    .pager button { padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text);cursor:pointer;font-weight:600;font-size:.85em;transition:all .2s; }
    .pager button:hover:not(:disabled) { border-color:var(--accent);background:rgba(0,212,255,0.08); }
    .pager button:disabled { opacity:.35;cursor:not-allowed; }

    .empty { padding:60px 20px;text-align:center;color:var(--muted); }
    .empty .icon { font-size:3em;margin-bottom:16px;display:block; }

    .ok-msg  { padding:10px 16px;background:rgba(46,213,115,0.1);border-left:3px solid #2ed573;border-radius:6px;color:#2ed573;font-weight:600;font-size:.88em;display:none; }
    .err-msg { padding:10px 16px;background:rgba(255,71,87,0.1);border-left:3px solid #ff4757;border-radius:6px;color:#ff4757;font-weight:600;font-size:.88em;display:none; }

    .modal { position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px; }
    .modal.show { display:flex; }
    .modal-card { background:rgba(12,16,32,0.95);border:1px solid var(--border);border-radius:16px;overflow:hidden;width:min(900px,100%);box-shadow:0 30px 80px rgba(0,0,0,0.5); }
    .modal-head { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border); }
    .modal-title { font-family:var(--font-head);font-weight:700;color:var(--accent); }
    .modal-close { padding:8px 12px;border-radius:8px;border:1px solid rgba(255,71,87,0.3);background:rgba(255,71,87,0.08);color:#ff6b7a;cursor:pointer;font-weight:700;transition:all .2s; }
    .modal-close:hover { background:rgba(255,71,87,0.15); }
    .modal-body { padding:16px; }
    .modal-img { width:100%;max-height:72vh;object-fit:contain;border-radius:10px;background:rgba(0,0,0,0.3); }
    .open-link { padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);text-decoration:none;font-size:.85em;font-weight:600;transition:all .2s; }
    .open-link:hover { border-color:var(--accent); }

    @media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.user-name{display:none}}
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     AUTH GUARD — solo usuarios NO admin
═══════════════════════════════════════ -->
<script>
  const _KC = { url:'https://auth.plai.mx', realm:'PLAI', clientId:'dev_tickets' };

  (function() {
    var token = sessionStorage.getItem('kc_access_token');
    if (!token) { location.href = 'login.html'; return; }
    try {
      var payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.exp * 1000 < Date.now()) { sessionStorage.clear(); location.href = 'login.html'; return; }

      // Verificar rol Admin — si es admin → redirigir al dashboard admin
      var clientRoles = (payload?.resource_access?.[_KC.clientId]?.roles || []).map(r=>r.toLowerCase());
      var realmRoles  = (payload?.realm_access?.roles || []).map(r=>r.toLowerCase());
      if ([...clientRoles,...realmRoles].includes('admin')) { location.href = 'dashboardtickets.html'; }
    } catch(e) { sessionStorage.clear(); location.href = 'login.html'; }
  })();

  window._logout = function() {
    sessionStorage.clear();
    location.href = _KC.url + '/realms/' + _KC.realm + '/protocol/openid-connect/logout'
      + '?client_id=' + _KC.clientId
      + '&post_logout_redirect_uri=' + encodeURIComponent(location.origin + '/login.html');
  };
</script>

<header>
  <div class="header-inner">
    <div class="logo"><span>📊</span> PLAi Soporte</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="user-chip">
        <div class="avatar" id="avatarInit">?</div>
        <div class="user-name" id="userName">Cargando…</div>
        <div class="badge-role">Usuario</div>
      </div>
      <button class="btn-logout" onclick="window._logout()">Salir</button>
    </div>
  </div>
</header>

<main>
  <div class="page-title">Mis Tickets</div>
  <div class="page-sub" id="userEmailSub">Cargando…</div>

  <div id="okMsg"  class="ok-msg"  style="margin-bottom:16px;"></div>
  <div id="errMsg" class="err-msg" style="margin-bottom:16px;"></div>

  <div class="kpis">
    <div class="kpi"><div class="k">Total</div><div class="v" id="kTotal">—</div></div>
    <div class="kpi"><div class="k">Alta</div><div class="v" id="kAlta">—</div></div>
    <div class="kpi"><div class="k">Media</div><div class="v" id="kMedia">—</div></div>
    <div class="kpi"><div class="k">Baja</div><div class="v" id="kBaja">—</div></div>
  </div>

  <div class="table-wrap">
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Ticket</th><th>Fecha</th><th>Prioridad</th>
            <th>Categoría</th><th>Área</th><th>Estatus</th>
            <th>Mensaje</th><th>Adjunto</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8"><div class="empty"><span class="icon">⏳</span>Cargando tus tickets…</div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="table-footer">
      <div class="muted" id="rangeText">—</div>
      <div class="pager">
        <button id="prevBtn" disabled>◀</button>
        <span class="muted">Offset: <span id="offsetTxt">0</span></span>
        <button id="nextBtn" disabled>▶</button>
      </div>
    </div>
  </div>
</main>

<!-- MODAL -->
<div class="modal" id="imgModal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Adjunto</div>
      <div style="display:flex;gap:8px;">
        <a class="open-link" id="openOrig" href="#" target="_blank">Abrir ↗</a>
        <button class="modal-close" onclick="closeModal()">Cerrar ✕</button>
      </div>
    </div>
    <div class="modal-body">
      <img class="modal-img" id="modalImg" src="" alt="Adjunto"/>
    </div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────
  // Datos de sesión
  // ─────────────────────────────────────────
  const API_BASE = 'https://n8n.plai.mx/webhook/dashboard/tickets';
  const LIMIT    = 20;

  const _name  = sessionStorage.getItem('kc_name')  || 'Usuario';
  const _email = sessionStorage.getItem('kc_email') || '';

  document.getElementById('userName').textContent    = _name;
  document.getElementById('avatarInit').textContent  = (_name[0] || '?').toUpperCase();
  document.getElementById('userEmailSub').textContent = _email
    ? `Mostrando tickets enviados desde: ${_email}`
    : 'Mostrando tus tickets.';

  let offset = 0;

  // ─────────────────────────────────────────
  // Helpers
  // ─────────────────────────────────────────
  const esc = s => String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString('es-MX',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
    catch { return iso; }
  }

  function pillP(p) {
    const v = String(p||'').toLowerCase();
    const cls = v==='alta'?'p-alta':v==='baja'?'p-baja':'p-media';
    const lbl = v==='alta'?'Alta':v==='baja'?'Baja':'Media';
    return `<span class="pill ${cls}"><span class="dot"></span>${lbl}</span>`;
  }

  function getAttachments(t) {
    let a = t?.attachments;
    if (typeof a==='string'){try{a=JSON.parse(a);}catch{a=[];}}
    if (!Array.isArray(a)) return [];
    return a.map(x=>({url:String(x?.url||x?.imagen_url||'').trim(),name:String(x?.file_name||'Adjunto').trim()}))
             .filter(x=>/^https?:\/\//i.test(x.url));
  }

  // ─────────────────────────────────────────
  // Fetch — filtra por email del usuario
  // ─────────────────────────────────────────
  async function loadTickets() {
    showOk(''); showErr('');
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;

    const url = new URL(API_BASE);
    // ← Aquí se envía el email para que n8n filtre en la BD
    url.searchParams.set('email',  _email);
    url.searchParams.set('limit',  LIMIT);
    url.searchParams.set('offset', offset);
    url.searchParams.set('order',  'desc');

    try {
      const res  = await fetch(url.toString());
      const data = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(data?.error || 'HTTP '+res.status);

      const tickets = Array.isArray(data.tickets) ? data.tickets :
                      Array.isArray(data.rows)     ? data.rows    :
                      Array.isArray(data)           ? data         : [];
      renderTickets(tickets);
      showOk('✅ Actualizado correctamente');
    } catch(e) {
      showErr('❌ Error: '+e.message);
      document.getElementById('tbody').innerHTML = `<tr><td colspan="8"><div class="empty"><span class="icon">⚠️</span>No se pudieron cargar los tickets.</div></td></tr>`;
    }
  }

  function renderTickets(tickets) {
    document.getElementById('kTotal').textContent  = tickets.length;
    document.getElementById('kAlta').textContent   = tickets.filter(t=>(t.prioridad||'').toLowerCase()==='alta').length;
    document.getElementById('kMedia').textContent  = tickets.filter(t=>(t.prioridad||'').toLowerCase()==='media').length;
    document.getElementById('kBaja').textContent   = tickets.filter(t=>(t.prioridad||'').toLowerCase()==='baja').length;

    if (!tickets.length) {
      document.getElementById('tbody').innerHTML = `<tr><td colspan="8"><div class="empty"><span class="icon">🎉</span>No tienes tickets aún.</div></td></tr>`;
      document.getElementById('rangeText').textContent = '0 resultados';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('prevBtn').disabled = offset===0;
      return;
    }

    document.getElementById('tbody').innerHTML = tickets.map(t => {
      const atts = getAttachments(t);
      const legacy = (t.imagen_url||t.adjunto_url||'').trim();
      const urls = atts.length ? atts : (legacy ? [{url:legacy,name:'Adjunto'}] : []);
      let adjCell = '<span class="muted">—</span>';
      if (urls.length) {
        adjCell = `<div style="display:flex;align-items:center;gap:8px;">
          <img class="thumb" src="${esc(urls[0].url)}" loading="lazy" referrerpolicy="no-referrer"/>
          <button class="thumb-btn" onclick='openModal(${JSON.stringify(urls[0].url)},${JSON.stringify(urls[0].name)})'>Ver</button>
        </div>`;
      }
      return `<tr>
        <td><span class="ticket-id">${esc(t.ticket_id||'')}</span></td>
        <td class="muted">${fmtDate(t.fecha_creacion)}</td>
        <td>${pillP(t.prioridad)}</td>
        <td>${esc(t.categoria||'')}</td>
        <td>${esc(t.area_soporte||'')}</td>
        <td class="status">${esc(t.estatus||'')}</td>
        <td>${esc(t.mensaje||'')}</td>
        <td>${adjCell}</td>
      </tr>`;
    }).join('');

    const from=offset+1, to=offset+tickets.length;
    document.getElementById('rangeText').textContent = `Mostrando ${from}–${to}`;
    document.getElementById('prevBtn').disabled = offset===0;
    document.getElementById('nextBtn').disabled = tickets.length < LIMIT;
    document.getElementById('offsetTxt').textContent = offset;
  }

  // ─────────────────────────────────────────
  // Modal
  // ─────────────────────────────────────────
  function openModal(url, title) {
    document.getElementById('modalImg').src = url;
    document.getElementById('modalTitle').textContent = title||'Adjunto';
    document.getElementById('openOrig').href = url;
    document.getElementById('imgModal').classList.add('show');
  }
  function closeModal() {
    document.getElementById('imgModal').classList.remove('show');
    document.getElementById('modalImg').src='';
  }
  document.getElementById('imgModal').addEventListener('click', e=>{ if(e.target===document.getElementById('imgModal')) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

  // ─────────────────────────────────────────
  // Paginación
  // ─────────────────────────────────────────
  document.getElementById('prevBtn').addEventListener('click',()=>{ offset=Math.max(0,offset-LIMIT); loadTickets(); });
  document.getElementById('nextBtn').addEventListener('click',()=>{ offset+=LIMIT; loadTickets(); });

  function showOk(m)  { const e=document.getElementById('okMsg');  e.textContent=m; e.style.display=m?'block':'none'; }
  function showErr(m) { const e=document.getElementById('errMsg'); e.textContent=m; e.style.display=m?'block':'none'; }

  // Init
  loadTickets();
</script>
</body>
</html>
