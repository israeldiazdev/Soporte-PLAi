<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soporte PLAi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background:
        radial-gradient(circle at 20% 50%, rgba(0, 150, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
      animation: rotate 20s linear infinite;
      z-index: 0;
    }

    @keyframes rotate { 100% { transform: rotate(360deg); } }

    .container {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding-top: 20px;
    }

    .header-logo {
      height: 70px;
      object-fit: contain;
      margin-bottom: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 2.5em;
      background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle { color: #8892b0; font-size: 1.1em; margin-bottom: 18px; }

    /* Botón ver mis tickets */
    .btn-tickets {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(0,212,255,0.10);
      border: 1px solid rgba(0,212,255,0.35);
      border-radius: 10px;
      color: #00d4ff;
      font-weight: 700;
      font-size: 0.9em;
      text-decoration: none;
      transition: all .2s ease;
      margin: 4px auto 0;
      width: fit-content;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-tickets:hover {
      background: rgba(0,212,255,0.22);
      border-color: rgba(0,212,255,0.6);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,212,255,0.2);
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 35px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: slideUp 0.6s ease-out;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .checkbox-group {
      margin-bottom: 25px;
      padding: 20px;
      background: rgba(100, 255, 218, 0.05);
      border: 1px solid rgba(100, 255, 218, 0.2);
      border-radius: 8px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .checkbox-container input[type="checkbox"],
    .checkbox-container input[type="radio"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #00d4ff;
    }

    .checkbox-container label {
      cursor: pointer;
      margin: 0;
      font-size: 1.1em;
      color: #e0e0e0;
      text-transform: none;
      letter-spacing: normal;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #64ffda;
      font-size: 0.95em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(100, 255, 218, 0.2);
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #64ffda;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 20px rgba(100, 255, 218, 0.2);
    }

    input::placeholder, textarea::placeholder { color: #8892b0; }

    input:disabled, textarea:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: rgba(255, 255, 255, 0.02);
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .verify-btn {
      background: linear-gradient(135deg, #2ed573 0%, #1e90ff 100%);
      margin-top: 10px;
    }

    h2 {
      color: #64ffda;
      font-size: 1.5em;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2::before { content: '◆'; color: #00d4ff; font-size: 0.8em; }

    .loading { display: inline-block; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } }

    .info-message {
      background: rgba(100, 255, 218, 0.1);
      border-left: 4px solid #64ffda;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      color: #64ffda;
      font-size: 0.95em;
    }

    .error-message {
      background: rgba(255, 71, 87, 0.1);
      border-left: 4px solid #ff4757;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      color: #ff4757;
      font-size: 0.95em;
    }

    .attachments-wrap {
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(100, 255, 218, 0.35);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .attachments-wrap.dragover {
      border-color: rgba(0, 212, 255, 0.8);
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.15);
      background: rgba(0, 212, 255, 0.05);
    }

    .attachments-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .attachments-hint { color: #8892b0; font-size: 0.9em; line-height: 1.4; flex: 1; min-width: 220px; }
    .attachments-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .attachments-btn {
      width: auto;
      padding: 10px 14px;
      font-size: 0.9em;
      letter-spacing: 0.6px;
      text-transform: none;
      border-radius: 8px;
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.35);
    }

    .attachments-btn.secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .attachments-btn:hover { filter: brightness(1.05); }

    .dropzone {
      border: 1px solid rgba(100, 255, 218, 0.18);
      border-radius: 10px;
      padding: 16px;
      background: rgba(0,0,0,0.18);
      color: #8892b0;
      font-size: 0.95em;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .dropzone strong { color: #64ffda; font-weight: 700; }

    .attachments-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(100, 255, 218, 0.2);
      background: rgba(0,0,0,0.25);
      min-height: 110px;
    }

    .thumb img { width: 100%; height: 110px; object-fit: cover; display: block; }

    .thumb-meta {
      padding: 8px 10px;
      font-size: 0.85em;
      color: #e0e0e0;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .remove-btn {
      width: auto;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85em;
      background: rgba(255, 71, 87, 0.18);
      border: 1px solid rgba(255, 71, 87, 0.35);
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }

    .remove-btn:hover { filter: brightness(1.05); }

    @media (max-width: 768px) {
      h1 { font-size: 2em; }
      .card { padding: 25px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="Imagenes/LOGO PLAi 1.png" alt="PLAi Logo" class="header-logo" />
      <h1>🤖 Soporte PLAi</h1>
      <p class="subtitle">Sistema inteligente de mesa de ayuda</p>
    </div>

    <div class="card">
      <form id="soporte-form">
        <div class="checkbox-group">
          <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 12px; color: #e0e0e0; font-size: 1.1em;">
              ¿Eres parte de la plantilla de empleados?
            </label>
          </div>
          <div style="display: flex; gap: 30px;">
            <div class="checkbox-container">
              <input type="radio" id="es-plantilla-si" name="es-plantilla" value="si" style="width: 20px; height: 20px;" />
              <label for="es-plantilla-si">Sí</label>
            </div>
            <div class="checkbox-container">
              <input type="radio" id="es-plantilla-no" name="es-plantilla" value="no" style="width: 20px; height: 20px;" />
              <label for="es-plantilla-no">No</label>
            </div>
          </div>
        </div>

        <div style="margin-bottom:20px;text-align:center;">
          <button type="button" class="btn-tickets" onclick="startKeycloakLogin()">
            🎫 Ver mis tickets
          </button>
        </div>

        <div id="info-message" style="display:none;"></div>

        <div id="email-section" style="display:none;">
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" />
          </div>
          <div id="verify-section">
            <button type="button" id="verify-btn" class="verify-btn">Verificar correo</button>
          </div>
        </div>

        <div id="form-fields" style="display:none;">
          <div id="email-field-no-plantilla" style="display:none;">
            <div class="form-group">
              <label>Correo electrónico</label>
              <input type="email" id="email-no-plantilla" name="email-no-plantilla" placeholder="tu@email.com" />
            </div>
          </div>

          <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" id="nombre-completo" name="nombre-completo" placeholder="Ingresa tu nombre completo" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Área</label>
              <input type="text" id="area" name="area" placeholder="Tu área o departamento" required />
            </div>
            <div class="form-group">
              <label>Puesto</label>
              <input type="text" id="puesto" name="puesto" placeholder="Tu puesto o cargo" required />
            </div>
          </div>

          <div class="form-group">
            <label>Asunto</label>
            <input type="text" id="asunto" name="asunto" placeholder="Resumen breve de tu consulta" required />
          </div>

          <div class="form-group">
            <label>Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Describe tu consulta o problema..." required></textarea>
          </div>

          <div class="form-group">
            <label>Adjuntar capturas (opcional)</label>
            <div id="attachments-wrap" class="attachments-wrap">
              <div class="attachments-top">
                <div class="attachments-hint">
                  <br/>
                  <strong></strong> • Máx <strong>3</strong> archivos • <strong>5MB</strong> c/u
                </div>
                <div class="attachments-actions">
                  <button type="button" id="pick-images" class="attachments-btn">Elegir imágenes</button>
                  <button type="button" id="clear-images" class="attachments-btn secondary">Limpiar</button>
                </div>
              </div>
              <div id="dropzone" class="dropzone" role="button" tabindex="0">
                Suelta tus imágenes aquí o <strong>haz clic</strong> para seleccionarlas
              </div>
              <input id="imagenes" name="imagenes" type="file" accept="image/png,image/jpeg,image/webp" multiple style="display:none;" />
              <div id="attachments-error" class="error-message" style="display:none; margin-top:10px;"></div>
              <div id="attachments-list" class="attachments-list" style="display:none;"></div>
            </div>
          </div>

          <button type="submit" id="submit-btn">Enviar</button>
        </div>
      </form>
    </div>

    <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; backdrop-filter:blur(5px); animation:fadeIn 0.3s ease;">
      <div id="modal-content" style="position:relative; max-width:700px; margin:50px auto; background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.2); border-radius:16px; padding:40px; box-shadow:0 20px 60px rgba(0,0,0,0.5); animation:slideDown 0.4s ease; max-height:85vh; overflow-y:auto;">
        <button id="close-modal" style="position:absolute; top:20px; right:20px; background:rgba(255,71,87,0.2); border:1px solid rgba(255,71,87,0.5); color:#ff4757; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.5em; display:flex; align-items:center; justify-content:center;">×</button>
        <div id="modal-body"></div>
      </div>
    </div>

  </div>

  <footer style="text-align:center;padding:24px 20px;color:rgba(255,255,255,0.25);font-size:0.82em;position:relative;z-index:1;margin-top:auto;width:100%;">
    ©️ 2026 PLAi. Todos los derechos reservados.
  </footer>

  <script>
    // ─────────────────────────────────────────
    // KEYCLOAK AUTHENTICATION - Shared Logic
    // ─────────────────────────────────────────
    const KC_CONFIG = {
      url:      '***',
      realm:    '***',
      clientId: '****',
    };

    const KC_REDIRECT = {
      admin: 'dashboardtickets.html',
      user:  'mis-tickets.html',
    };

    // PKCE helpers
    const kc_b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    const kc_sha256 = plain => crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
    const kc_rnd = (n=64) => { const a=new Uint8Array(n); crypto.getRandomValues(a); return kc_b64url(a); };

    // Check if user is admin
    function kc_checkIsAdmin(payload) {
      const clientRoles = payload?.resource_access?.[KC_CONFIG.clientId]?.roles || [];
      const realmRoles  = payload?.realm_access?.roles || [];
      const all = [...clientRoles, ...realmRoles].map(r => r.toLowerCase());
      return all.includes('admin');
    }

    // Start Keycloak login flow
    async function startKeycloakLogin() {
      const verifier  = kc_rnd();
      const state     = kc_rnd(32);
      const challenge = kc_b64url(await kc_sha256(verifier));

      sessionStorage.setItem('kc_verifier', verifier);
      sessionStorage.setItem('kc_state',    state);

      const url = new URL(`${KC_CONFIG.url}/realms/${KC_CONFIG.realm}/protocol/openid-connect/auth`);
      url.searchParams.set('client_id',             KC_CONFIG.clientId);
      url.searchParams.set('redirect_uri',          location.origin + location.pathname);
      url.searchParams.set('response_type',         'code');
      url.searchParams.set('scope',                 'openid profile email roles');
      url.searchParams.set('state',                 state);
      url.searchParams.set('code_challenge',        challenge);
      url.searchParams.set('code_challenge_method', 'S256');

      location.href = url.toString();
    }

    // Handle Keycloak callback
    async function handleKeycloakCallback() {
      const params = new URLSearchParams(location.search);
      const code   = params.get('code');
      const state  = params.get('state');
      
      if (!code) return false;

      if (state !== sessionStorage.getItem('kc_state')) {
        console.error('Estado inválido. Intenta de nuevo.');
        return true;
      }

      // Limpiar URL
      history.replaceState({}, '', location.pathname);

      try {
        const res = await fetch(`${KC_CONFIG.url}/realms/${KC_CONFIG.realm}/protocol/openid-connect/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type:    'authorization_code',
            client_id:     KC_CONFIG.clientId,
            code,
            redirect_uri:  location.origin + location.pathname,
            code_verifier: sessionStorage.getItem('kc_verifier'),
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error_description || data.error || 'Token error');

        // Guardar tokens
        sessionStorage.setItem('kc_access_token',  data.access_token);
        sessionStorage.setItem('kc_refresh_token', data.refresh_token || '');
        sessionStorage.setItem('kc_id_token',      data.id_token || '');

        // Decodificar payload del access token
        const payload = JSON.parse(atob(data.access_token.split('.')[1]));

        // Extraer email y nombre
        const email = payload?.email || payload?.preferred_username || '';
        const name  = payload?.name  || payload?.given_name || email;

        // Extraer todos los roles (client + realm)
        const clientRoles = payload?.resource_access?.[KC_CONFIG.clientId]?.roles || [];
        const realmRoles  = payload?.realm_access?.roles || [];
        const allRoles    = [...new Set([...clientRoles, ...realmRoles])];

        sessionStorage.setItem('kc_email', email);
        sessionStorage.setItem('kc_name',  name);
        sessionStorage.setItem('kc_roles', JSON.stringify(allRoles));

        // Redirigir según rol
        location.href = kc_checkIsAdmin(payload) ? KC_REDIRECT.admin : KC_REDIRECT.user;
        return true;

      } catch(e) {
        console.error('Error de autenticación:', e.message);
        return true;
      }
    }

    // ─────────────────────────────────────────
    // TICKET SUPPORT FORM
    // ─────────────────────────────────────────
    const form = document.getElementById('soporte-form');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalBody = document.getElementById('modal-body');
    const closeModalBtn = document.getElementById('close-modal');

    const radioSi = document.getElementById('es-plantilla-si');
    const radioNo = document.getElementById('es-plantilla-no');

    const emailSection = document.getElementById('email-section');
    const verifyBtn = document.getElementById('verify-btn');
    const emailInput = document.getElementById('email');

    const emailNoPlantilla = document.getElementById('email-no-plantilla');
    const emailFieldNoPlantilla = document.getElementById('email-field-no-plantilla');

    const infoMessage = document.getElementById('info-message');
    const formFields = document.getElementById('form-fields');

    const attachmentsWrap = document.getElementById('attachments-wrap');
    const dropzone = document.getElementById('dropzone');
    const pickImagesBtn = document.getElementById('pick-images');
    const clearImagesBtn = document.getElementById('clear-images');
    const imagenesInput = document.getElementById('imagenes');
    const attachmentsList = document.getElementById('attachments-list');
    const attachmentsError = document.getElementById('attachments-error');

    const MAX_FILES = 3;
    const MAX_SIZE = 5 * 1024 * 1024;
    const ALLOWED = new Set(['image/png','image/jpeg','image/webp']);
    let selectedFiles = [];
    const previewUrls = new Map();

    const WEBHOOK_URL = 'https://n8n.plai.mx/webhook/soporte-plai-prod';
    const DIRECTUS_URL = 'https://admin.plai.mx/items/Empleados';
    const DIRECTUS_TOKEN = '';

    let empleadoVerificado = false;
    let esPlantilla = false;

    function openModal() { modalOverlay.style.display = 'block'; document.body.style.overflow = 'hidden'; }
    function closeModal() { modalOverlay.style.display = 'none'; document.body.style.overflow = 'auto'; }

    function showMessage(message, type = 'info') {
      infoMessage.style.display = 'block';
      infoMessage.className = type === 'error' ? 'error-message' : 'info-message';
      infoMessage.textContent = message;
    }

    function hideMessage() { infoMessage.style.display = 'none'; }
    function setRequired(el, required) { if (!el) return; el.required = !!required; if (!required) el.removeAttribute('required'); }
    function setEnabled(el, enabled) { if (!el) return; el.disabled = !enabled; }

    function resetAutoFields() {
      document.getElementById('nombre-completo').value = '';
      document.getElementById('puesto').value = '';
      document.getElementById('area').value = '';
    }

    function lockAutoFields(lock) {
      ['nombre-completo','puesto','area'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = !!lock;
      });
    }

    function setModePlantilla() {
      esPlantilla = true; empleadoVerificado = false;
      emailSection.style.display = 'block'; formFields.style.display = 'none';
      emailFieldNoPlantilla.style.display = 'none';
      setEnabled(emailNoPlantilla, false); setRequired(emailNoPlantilla, false);
      setEnabled(emailInput, true); setRequired(emailInput, true);
      emailInput.value = ''; hideMessage();
      showMessage('ℹ️ Ingresa tu correo y presiona "Verificar correo".', 'info');
      clearAttachments();
    }

    function setModeNoPlantilla() {
      esPlantilla = false; empleadoVerificado = false;
      emailSection.style.display = 'none'; formFields.style.display = 'block';
      emailFieldNoPlantilla.style.display = 'block';
      setEnabled(emailInput, false); setRequired(emailInput, false);
      setEnabled(emailNoPlantilla, true); setRequired(emailNoPlantilla, true);
      lockAutoFields(false); emailInput.value = ''; emailNoPlantilla.value = '';
      resetAutoFields(); document.getElementById('asunto').value = ''; document.getElementById('mensaje').value = '';
      hideMessage(); clearAttachments();
    }

    async function verificarEmpleado(correo) {
      try {
        verifyBtn.disabled = true; verifyBtn.textContent = 'Verificando...'; hideMessage();
        const email = String(correo || '').trim().toLowerCase();
        if (!email) { showMessage('⚠️ Ingresa un correo.', 'error'); return; }

        const url = new URL(DIRECTUS_URL);
        url.searchParams.set('fields', 'nombre_completo,posicion,direccion_adscrita.nombre_de_direccion');
        url.searchParams.set('limit', '1');
        url.searchParams.set('filter[correo][_eq]', email);

        const headers = { 'Accept': 'application/json' };
        if (DIRECTUS_TOKEN) headers['Authorization'] = `Bearer ${DIRECTUS_TOKEN}`;

        const response = await fetch(url.toString(), { method: 'GET', headers, mode: 'cors' });
        if (response.status === 401 || response.status === 403) throw new Error('NO_AUTH');
        if (!response.ok) throw new Error(`DIRECTUS_HTTP_${response.status}`);

        const data = await response.json();
        const empleado = data?.data?.[0];

        if (!empleado) {
          showMessage('❌ No se encontró el correo en la plantilla. Verifica tu correo o selecciona "No".', 'error');
          empleadoVerificado = false; formFields.style.display = 'none'; return;
        }

        formFields.style.display = 'block'; emailFieldNoPlantilla.style.display = 'none';
        document.getElementById('nombre-completo').value = String(empleado.nombre_completo || '').trim();
        document.getElementById('puesto').value = empleado.posicion || '';
        document.getElementById('area').value = empleado.direccion_adscrita?.nombre_de_direccion || '';
        lockAutoFields(true); empleadoVerificado = true;
        showMessage('✅ Empleado verificado. Completa asunto, mensaje y adjuntos (opcional).', 'info');
        setTimeout(() => { document.getElementById('asunto').focus(); document.getElementById('asunto').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
      } catch (error) {
        console.error('Error al verificar empleado:', error);
        if (error instanceof TypeError && String(error.message).toLowerCase().includes('fetch')) {
          showMessage('❌ No se pudo consultar el directorio (bloqueo CORS o red).', 'error');
        } else if (error.message === 'NO_AUTH') {
          showMessage('❌ No autorizado para consultar el directorio.', 'error');
        } else {
          showMessage('❌ Error al verificar el empleado. Intenta nuevamente.', 'error');
        }
        empleadoVerificado = false; formFields.style.display = 'none';
      } finally {
        verifyBtn.disabled = false; verifyBtn.textContent = 'Verificar correo';
      }
    }

    function showAttachmentsError(msg) { attachmentsError.style.display = 'block'; attachmentsError.textContent = msg; }
    function hideAttachmentsError() { attachmentsError.style.display = 'none'; attachmentsError.textContent = ''; }
    function fileKey(f) { return `${f.name}__${f.size}__${f.lastModified}`; }

    function validateFiles(files) {
      if (files.length > MAX_FILES) return `Máximo ${MAX_FILES} imágenes.`;
      for (const f of files) {
        if (!ALLOWED.has(f.type)) return `Formato no permitido: ${f.name}`;
        if (f.size > MAX_SIZE) return `Archivo muy grande (máx 5MB): ${f.name}`;
      }
      return null;
    }

    function revokeAllPreviews() { for (const url of previewUrls.values()) { try { URL.revokeObjectURL(url); } catch (_) {} } previewUrls.clear(); }

    function clearAttachments() {
      selectedFiles = []; imagenesInput.value = '';
      attachmentsList.style.display = 'none'; attachmentsList.innerHTML = '';
      hideAttachmentsError(); revokeAllPreviews();
    }

    function addFiles(newFiles) {
      hideAttachmentsError();
      const incoming = [...(newFiles || [])].filter(Boolean);
      if (!incoming.length) return;
      const merged = [...selectedFiles, ...incoming];
      const seen = new Set(); const deduped = [];
      for (const f of merged) { const k = fileKey(f); if (seen.has(k)) continue; seen.add(k); deduped.push(f); }
      const err = validateFiles(deduped);
      if (err) { showAttachmentsError(err); return; }
      selectedFiles = deduped; renderAttachments();
    }

    function renderAttachments() {
      revokeAllPreviews();
      if (!selectedFiles.length) { attachmentsList.style.display = 'none'; attachmentsList.innerHTML = ''; return; }
      attachmentsList.style.display = 'grid'; attachmentsList.innerHTML = '';
      selectedFiles.forEach((file, idx) => {
        const k = fileKey(file); const url = URL.createObjectURL(file); previewUrls.set(k, url);
        const card = document.createElement('div'); card.className = 'thumb';
        card.innerHTML = `<img src="${url}" alt="captura" /><div class="thumb-meta"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;">${file.name}</span><button type="button" class="remove-btn" data-idx="${idx}">Quitar</button></div>`;
        attachmentsList.appendChild(card);
      });
      attachmentsList.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => { const i = Number(e.currentTarget.getAttribute('data-idx')); selectedFiles.splice(i, 1); renderAttachments(); });
      });
    }

    pickImagesBtn.addEventListener('click', () => { hideAttachmentsError(); imagenesInput.click(); });
    clearImagesBtn.addEventListener('click', () => { clearAttachments(); });
    dropzone.addEventListener('click', () => { hideAttachmentsError(); imagenesInput.click(); });
    dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); imagenesInput.click(); } });
    imagenesInput.addEventListener('change', () => { const files = [...(imagenesInput.files || [])]; imagenesInput.value = ''; addFiles(files); });

    function isFileDrag(evt) { const dt = evt.dataTransfer; return dt && dt.types && [...dt.types].includes('Files'); }
    ['dragenter','dragover'].forEach(evName => { attachmentsWrap.addEventListener(evName, (e) => { if (!isFileDrag(e)) return; e.preventDefault(); e.stopPropagation(); attachmentsWrap.classList.add('dragover'); }); });
    ['dragleave','drop'].forEach(evName => { attachmentsWrap.addEventListener(evName, (e) => { e.preventDefault(); e.stopPropagation(); attachmentsWrap.classList.remove('dragover'); }); });
    attachmentsWrap.addEventListener('drop', (e) => { if (!isFileDrag(e)) return; const files = [...(e.dataTransfer.files || [])]; addFiles(files); });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => e.preventDefault());

    radioSi.addEventListener('change', (e) => { if (e.target.checked) setModePlantilla(); });
    radioNo.addEventListener('change', (e) => { if (e.target.checked) setModeNoPlantilla(); });

    verifyBtn.addEventListener('click', () => {
      const correo = emailInput.value.trim();
      if (!correo) { showMessage('⚠️ Por favor ingresa tu correo', 'error'); emailInput.focus(); return; }
      if (!emailInput.validity.valid) { showMessage('⚠️ Ingresa un correo válido', 'error'); emailInput.focus(); return; }
      verificarEmpleado(correo);
    });

    closeModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.style.display === 'block') closeModal(); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (esPlantilla && !empleadoVerificado) { showMessage('⚠️ Verifica tu correo antes de enviar.', 'error'); return; }
      const correoFinal = esPlantilla ? emailInput.value.trim() : emailNoPlantilla.value.trim();
      if (!correoFinal) { showMessage('⚠️ Falta el correo.', 'error'); return; }
      hideAttachmentsError();
      const err = validateFiles(selectedFiles);
      if (err) { showAttachmentsError(err); return; }

      const fd = new FormData();
      fd.append('nombre', document.getElementById('nombre-completo').value);
      fd.append('email', correoFinal);
      fd.append('area', document.getElementById('area').value);
      fd.append('puesto', document.getElementById('puesto').value);
      fd.append('asunto', document.getElementById('asunto').value);
      fd.append('mensaje', document.getElementById('mensaje').value);
      fd.append('es_plantilla', String(esPlantilla));
      selectedFiles.forEach((file) => { fd.append('imagenes', file, file.name); });

      openModal();
      modalBody.innerHTML = `<div style="text-align:center; padding:40px 20px;"><div style="font-size:60px; margin-bottom:20px;">🤖</div><div class="loading" style="font-size:1.4em; margin-bottom:15px; color:#64ffda; font-weight:600;">Procesando ticket...</div><div style="color:#8892b0;">Clasificando y asignando prioridad</div><div style="margin-top:30px;"><div style="width:200px; height:4px; background:rgba(100,255,218,0.2); border-radius:2px; margin:0 auto; overflow:hidden;"><div style="width:100%; height:100%; background:linear-gradient(90deg,#00d4ff,#7b2ff7); animation:loading 1.5s ease-in-out infinite;"></div></div></div></div>`;

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true; submitBtn.textContent = 'Procesando...';

      try {
        const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Accept': 'application/json' }, body: fd });
        if (!res.ok) throw new Error(`Error HTTP: ${res.status}`);
        const responseData = await res.json();
        const ticket = responseData?.json ?? responseData ?? {};

        const categoriaUI = ticket.categoria ?? ticket.categoria_ia ?? ticket.clasificacion?.categoria ?? 'General';
        const prioridadUI = ticket.prioridad ?? ticket.prioridad_ia ?? ticket.clasificacion?.prioridad ?? 'media';
        const estatusUI   = ticket.estatus   ?? ticket.estatus_ia   ?? ticket.clasificacion?.estatus   ?? 'en revisión';
        const respuestaUI = ticket.respuesta_usuario ?? ticket.clasificacion?.respuesta_usuario ?? ticket.message ?? '';

        modalBody.innerHTML = `
          <h2 style="color:#64ffda; font-size:1.8em; margin-bottom:25px; display:flex; align-items:center; gap:10px;">
            <span style="color:#00d4ff;">◆</span> ✅ Ticket Creado
          </h2>
          <div style="background:rgba(100,255,218,0.1); border-left:4px solid #64ffda; padding:20px; margin-bottom:25px; border-radius:8px;">
            <strong style="color:#64ffda; font-size:1.1em;">🎫 ID del Ticket:</strong>
            <div style="font-family:monospace; background:rgba(0,0,0,0.4); padding:10px 15px; border-radius:6px; margin-top:10px; font-size:1.2em; color:#00d4ff;">${ticket.id_ticket || 'Generando...'}</div>
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:20px; margin-bottom:25px;">
            <div style="background:rgba(0,212,255,0.1); padding:15px; border-radius:8px; border:1px solid rgba(0,212,255,0.3);"><div style="font-size:0.85em; color:#8892b0; text-transform:uppercase; margin-bottom:5px;">Categoría</div><div style="font-size:1.2em; color:#00d4ff; font-weight:600;">${categoriaUI}</div></div>
            <div style="background:${prioridadUI === 'alta' ? 'rgba(255,71,87,0.1)' : prioridadUI === 'media' ? 'rgba(255,165,2,0.1)' : 'rgba(46,213,115,0.1)'}; padding:15px; border-radius:8px; border:1px solid ${prioridadUI === 'alta' ? 'rgba(255,71,87,0.3)' : prioridadUI === 'media' ? 'rgba(255,165,2,0.3)' : 'rgba(46,213,115,0.3)'};">
              <div style="font-size:0.85em; color:#8892b0; text-transform:uppercase; margin-bottom:5px;">Prioridad</div>
              <div style="font-size:1.2em; color:${prioridadUI === 'alta' ? '#ff4757' : prioridadUI === 'media' ? '#ffa502' : '#2ed573'}; font-weight:600; text-transform:uppercase;">${prioridadUI}</div>
            </div>
            <div style="background:rgba(100,255,218,0.1); padding:15px; border-radius:8px; border:1px solid rgba(100,255,218,0.3);"><div style="font-size:0.85em; color:#8892b0; text-transform:uppercase; margin-bottom:5px;">Estatus</div><div style="font-size:1.2em; color:#64ffda; font-weight:600;">${estatusUI}</div></div>
          </div>
          <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(100,255,218,0.2); border-radius:8px; padding:25px; margin-bottom:25px;">
            <h3 style="color:#64ffda; font-size:1.2em; margin-bottom:15px;">💬 Respuesta</h3>
            <div style="color:#e0e0e0; line-height:1.8;">${respuestaUI ? String(respuestaUI).replace(/\n/g, '<br>') : '✅ Ticket procesado.'}</div>
          </div>
          <button onclick="document.getElementById('close-modal').click()" style="width:100%; padding:16px; background:linear-gradient(135deg,#00d4ff 0%, #7b2ff7 100%); border:none; border-radius:8px; color:white; font-size:1.1em; font-weight:600; cursor:pointer;">Cerrar</button>
        `;

        form.reset(); empleadoVerificado = false; esPlantilla = false;
        radioSi.checked = false; radioNo.checked = false;
        emailSection.style.display = 'none'; formFields.style.display = 'none';
        hideMessage(); clearAttachments();
        setEnabled(emailInput, true); setEnabled(emailNoPlantilla, true);

      } catch (err2) {
        console.error('Error completo:', err2);
        modalBody.innerHTML = `<div style="text-align:center; padding:40px 20px;"><div style="font-size:60px; margin-bottom:20px;">❌</div><h2 style="color:#ff4757; font-size:1.8em; margin-bottom:15px;">Error al crear el ticket</h2><div style="background:rgba(255,71,87,0.1); border-left:4px solid #ff4757; padding:20px; border-radius:8px; text-align:left;"><div style="color:#ff4757; font-weight:bold; margin-bottom:10px;">No se pudo procesar</div><div style="color:#e0e0e0;">Intenta nuevamente.</div><div style="font-size:0.85em; color:#8892b0; margin-top:15px; font-family:monospace;">Detalle: ${err2.message}</div></div></div>`;
      } finally {
        submitBtn.disabled = false; submitBtn.textContent = 'Enviar';
      }
    });

    setEnabled(emailInput, false); setEnabled(emailNoPlantilla, false);
    setRequired(emailInput, false); setRequired(emailNoPlantilla, false);

    // ─────────────────────────────────────────
    // Initialize Keycloak callback handling
    // ─────────────────────────────────────────
    (async () => {
      // Check if session is valid
      const token = sessionStorage.getItem('kc_access_token');
      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          // Si el token es válido, redirigir al dashboard
          if (payload.exp * 1000 > Date.now()) {
            const isAdmin = kc_checkIsAdmin(payload);
            location.href = isAdmin ? KC_REDIRECT.admin : KC_REDIRECT.user;
            return;
          }
        } catch (e) {
          // Token inválido, continuar
        }
      }
      
      // Procesar callback de Keycloak (después de login)
      await handleKeycloakCallback();
    })();
  </script>
</body>
</html>
