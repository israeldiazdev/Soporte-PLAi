<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PLAi · Acceso</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #050810; --border: rgba(255,255,255,0.07);
      --accent: #00d4ff; --accent2: #7b2ff7;
      --text: #e8eaf0; --muted: #5a6080;
      --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    html, body { height: 100%; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
    .bg-grid { position:fixed;inset:0;z-index:0; background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px); background-size:60px 60px; animation:gridMove 20s linear infinite; }
    @keyframes gridMove{0%{background-position:0 0}100%{background-position:60px 60px}}
    .orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;animation:orbFloat 8s ease-in-out infinite;}
    .orb-1{width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,255,0.12),transparent 70%);top:-150px;left:-150px;animation-duration:10s;}
    .orb-2{width:400px;height:400px;background:radial-gradient(circle,rgba(123,47,247,0.15),transparent 70%);bottom:-100px;right:-100px;animation-duration:13s;animation-delay:-4s;}
    @keyframes orbFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-20px)}66%{transform:translate(-20px,30px)}}
    .card{position:relative;z-index:10;width:min(420px,92vw);background:rgba(12,16,32,0.85);border:1px solid var(--border);border-radius:20px;padding:48px 40px;backdrop-filter:blur(24px);box-shadow:0 0 0 1px rgba(0,212,255,0.05),0 40px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.05);animation:cardIn .6s cubic-bezier(.22,1,.36,1) both;}
    @keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);}
    .brand{display:flex;justify-content:center;margin-bottom:36px;}
    .brand img{max-height:80px;object-fit:contain;}
    .brand-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3em;box-shadow:0 0 20px rgba(0,212,255,0.35);}
    .brand-name{font-family:var(--font-head);font-weight:800;font-size:1.5em;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .brand-sub{font-size:.75em;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:500;}
    .card h1{font-family:var(--font-head);font-size:1.9em;font-weight:800;line-height:1.15;margin-bottom:8px;letter-spacing:-0.5px;}
    .card p{color:var(--muted);font-size:.95em;line-height:1.6;margin-bottom:36px;}
    .btn-sso{width:100%;padding:16px 24px;border-radius:12px;border:none;cursor:pointer;font-family:var(--font-head);font-size:1em;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 24px rgba(0,212,255,0.25);display:flex;align-items:center;justify-content:center;gap:12px;}
    .btn-sso:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,212,255,0.4);}
    .btn-sso:active{transform:translateY(0);}
    .key-icon{width:20px;height:20px;background:rgba(255,255,255,0.2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.9em;flex-shrink:0;}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .divider{display:flex;align-items:center;gap:12px;margin:28px 0;color:var(--muted);font-size:.8em;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .security-note{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border:1px solid rgba(0,212,255,0.12);border-radius:10px;background:rgba(0,212,255,0.04);font-size:.82em;color:var(--muted);line-height:1.5;}
    .shield{color:var(--accent);font-size:1.1em;flex-shrink:0;}
    .card-footer{margin-top:32px;text-align:center;font-size:.78em;color:var(--muted);}
    .card-footer a{color:var(--accent);text-decoration:none;}
    footer{text-align:center;padding:24px 20px;color:rgba(255,255,255,0.25);font-size:0.82em;position:relative;z-index:1;margin-top:auto;width:100%;}
    .toast{position:fixed;top:24px;right:24px;z-index:999;padding:14px 20px;background:rgba(255,71,87,0.15);border:1px solid rgba(255,71,87,0.4);border-radius:10px;color:#ff4757;font-size:.9em;font-weight:600;display:none;}
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="toast" id="toast"></div>

<div class="card">
  <div class="brand">
    <img src="Imagenes/LOGO PLAi 1.png" alt="PLAi Logo" />
  </div>
  <h1>Bienvenido de vuelta</h1>
  <p>Accede a tu portal de tickets con tu cuenta institucional de PLAi.</p>
  <button class="btn-sso" id="loginBtn" onclick="doLogin()">
    <div class="key-icon">🔑</div>
    <span id="btnText">Iniciar sesión</span>
    <div class="spinner" id="spinner"></div>
  </button>
  <div class="divider">autenticación segura</div>
  <div class="security-note">
    <span class="shield">🛡</span>
    <span>Tu sesión está protegida por Keycloak SSO. Serás redirigido al portal de autenticación institucional de PLAi.</span>
  </div>
</div>

<script>
  // ─────────────────────────────────────────
  // CONFIGURACIÓN KEYCLOAK
  // ─────────────────────────────────────────
  const KC = {
    url:      '***',
    realm:    '***',
    clientId: '****',
  };
  const REDIRECT = {
    admin: 'dashboardtickets.html',
    user:  'mis-tickets.html',
  };

  // ─────────────────────────────────────────
  // PKCE helpers
  // ─────────────────────────────────────────
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const sha256 = plain => crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
  const rnd = (n=64) => { const a=new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); };

  // ─────────────────────────────────────────
  // Detectar si el usuario es admin
  // Busca el rol "Admin" en resource_access.dev_tickets.roles (client role)
  // y también en realm_access.roles por si acaso
  // ─────────────────────────────────────────
  function checkIsAdmin(payload) {
    const clientRoles = payload?.resource_access?.[KC.clientId]?.roles || [];
    const realmRoles  = payload?.realm_access?.roles || [];
    const all = [...clientRoles, ...realmRoles].map(r => r.toLowerCase());
    return all.includes('admin');
  }

  // ─────────────────────────────────────────
  // Callback — intercambio de code por token
  // ─────────────────────────────────────────
  async function handleCallback() {
    const params = new URLSearchParams(location.search);
    const code   = params.get('code');
    const state  = params.get('state');
    if (!code) return false;

    if (state !== sessionStorage.getItem('kc_state')) {
      showToast('Estado inválido. Intenta de nuevo.');
      return true;
    }

    history.replaceState({}, '', location.pathname);

    try {
      const res = await fetch(`${KC.url}/realms/${KC.realm}/protocol/openid-connect/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          grant_type:    'authorization_code',
          client_id:     KC.clientId,
          code,
          redirect_uri:  location.origin + location.pathname,
          code_verifier: sessionStorage.getItem('kc_verifier'),
        }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.error || 'Token error');

      // Guardar tokens
      sessionStorage.setItem('kc_access_token',  data.access_token);
      sessionStorage.setItem('kc_refresh_token', data.refresh_token || '');
      sessionStorage.setItem('kc_id_token',      data.id_token || '');

      // Decodificar payload del access token
      const payload = JSON.parse(atob(data.access_token.split('.')[1]));

      // Extraer email y nombre
      const email = payload?.email || payload?.preferred_username || '';
      const name  = payload?.name  || payload?.given_name || email;

      // Extraer todos los roles (client + realm)
      const clientRoles = payload?.resource_access?.[KC.clientId]?.roles || [];
      const realmRoles  = payload?.realm_access?.roles || [];
      const allRoles    = [...new Set([...clientRoles, ...realmRoles])];

      sessionStorage.setItem('kc_email', email);
      sessionStorage.setItem('kc_name',  name);
      sessionStorage.setItem('kc_roles', JSON.stringify(allRoles));

      // Redirigir según rol
      location.href = checkIsAdmin(payload) ? REDIRECT.admin : REDIRECT.user;

    } catch(e) {
      showToast('Error de autenticación: ' + e.message);
      const btn = document.getElementById('loginBtn');
      btn.disabled = false;
      document.getElementById('btnText').textContent = 'Iniciar sesión con Keycloak';
      document.getElementById('spinner').style.display = 'none';
    }
    return true;
  }

  // ─────────────────────────────────────────
  // Iniciar login con PKCE
  // ─────────────────────────────────────────
  async function doLogin() {
    document.getElementById('loginBtn').disabled = true;
    document.getElementById('btnText').textContent = 'Redirigiendo…';
    document.getElementById('spinner').style.display = 'block';

    const verifier  = rnd();
    const state     = rnd(32);
    const challenge = b64url(await sha256(verifier));

    sessionStorage.setItem('kc_verifier', verifier);
    sessionStorage.setItem('kc_state',    state);

    const url = new URL(`${KC.url}/realms/${KC.realm}/protocol/openid-connect/auth`);
    url.searchParams.set('client_id',             KC.clientId);
    url.searchParams.set('redirect_uri',          location.origin + location.pathname);
    url.searchParams.set('response_type',         'code');
    url.searchParams.set('scope',                 'openid profile email roles');
    url.searchParams.set('state',                 state);
    url.searchParams.set('code_challenge',        challenge);
    url.searchParams.set('code_challenge_method', 'S256');

    location.href = url.toString();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = '⚠ ' + msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 6000);
  }

  // ─────────────────────────────────────────
  // Init
  // ─────────────────────────────────────────
  (async () => {
    const isCallback = await handleCallback();
    if (isCallback) return;

    // Si ya hay sesión válida → redirigir directo
    const token = sessionStorage.getItem('kc_access_token');
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        if (payload.exp * 1000 > Date.now()) {
          location.href = checkIsAdmin(payload) ? REDIRECT.admin : REDIRECT.user;
          return;
        }
      } catch {}
      sessionStorage.clear();
    }
  })();
</script>

<footer>
  ©️ 2026 PLAi. Todos los derechos reservados.
</footer>
</body>
</html>
